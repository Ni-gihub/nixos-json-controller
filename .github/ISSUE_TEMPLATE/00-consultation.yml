name: 相談・要望
description: 方向性、課題、改善したいことを相談する
title: "[相談] "
body:
  - type: markdown
    attributes:
      value: "相談の段階で起票できます。目的が整理できたらPBIやTaskへ分けます。詳細な実装方針は未確定でも構いません。"
  - type: textarea
    id: question
    attributes:
      label: 相談したいこと
      description: 決めたいこと・困っていること・実現したい変化を具体的に書いてください。
      placeholder: "NixOSの構成によって操作方法が異なる。安全に対応する範囲を整理したい。"
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: 背景・確認済みの事実
      description: 分かっている事実、再現した状況、参考Issue・PRを記載します。仮説は仮説と明記します。
      placeholder: "確認した環境、関連Issue、まだ分かっていないこと。"
    validations:
      required: false
  - type: textarea
    id: desired
    attributes:
      label: 期待する変化
      description: 相談が解決したときに何が判断できる／できるようになるかを書いてください。
      placeholder: "対応範囲と、対応しない条件を合意できる。"
    validations:
      required: false
