name: Task（実装・調査）
description: PBIに寄与する具体的な作業や調査を管理する
type: Task
title: "[TASK] "
body:
  - type: markdown
    attributes:
      value: "記述ルール: [Issueの書き方](https://github.com/nxc-project/nixos-json-controller/blob/main/docs/project-management/issue-writing.md)。Taskは、目的のある独立した作業単位です。細かい関数単位へ機械的に分割せず、実装方針が未確定でも調査を始められます。特定PBIの成果に寄与するTaskでは「Parent PBI number (optional)」に親PBI番号だけを入力してください。Issue作成後、GitHub Actionsが親子関係を設定します。既存Taskは親PBIのSub-issuesから追加できます。"
  - type: textarea
    id: why
    attributes:
      label: Why（作業が必要な理由）
      description: この作業が必要な理由、今の障害、親PBIへの貢献を書いてください。
      placeholder: "現状は...。これを解消しないと...ができない。"
    validations:
      required: true
  - type: textarea
    id: approach
    attributes:
      label: 方針・How（分かっている範囲）
      description: 対象、現行実装、仮説、候補などを記載します。未調査の原因や技術選定を決定事項として書かないでください。
      placeholder: "確認済み: ...。仮説: ...。次に...を比較する。"
    validations:
      required: false
  - type: textarea
    id: done
    attributes:
      label: 作業完了条件
      description: 作業の結果として確認できることを少数に絞ってください。必要なら追加テスト・ドキュメント・測定結果も含めます。
      placeholder: "- ...が再現条件で解消する。\n- ...の判断根拠が記録される。"
    validations:
      required: false
  - type: textarea
    id: verification
    attributes:
      label: 検証・リスク
      description: 関連するテスト・CI・実機確認、境界条件、rollback、未確認事項を書いてください。未実施は未実施とします。
      placeholder: "- 自動テスト: ...\n- 手動確認: ...\n- 未確認: ..."
    validations:
      required: false
  - type: textarea
    id: related
    attributes:
      label: 関連Issue・PR
      description: 親PBI、Blocked by、Blocks、Relatedを区別して記載してください。
      placeholder: "- Project: #166\n- PBL: #167\n- PBI: #番号\n- Blocked by: #番号"
    validations:
      required: false
  - type: input
    id: parent_pbi
    attributes:
      label: Parent PBI number (optional)
      description: 親PBIがある場合はIssue番号だけを入力してください（例: 177）。空欄なら親子関係を設定せず、独立Issueとして作成します。
      placeholder: "177"
    validations:
      required: false
  - type: textarea
    id: supplemental
    attributes:
      label: 補足・詳細記録
      description: 上の項目に収まらない設計判断、調査記録、比較結果、履歴、追加の検証情報などを記載します。重複は避け、必要な情報を保持してください。
      placeholder: "設計判断、調査メモ、関連資料など（必要な場合のみ）。"
    validations:
      required: false
