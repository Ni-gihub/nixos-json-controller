name: Bug（不具合）
description: 想定と異なる挙動や回帰を記録する
type: Bug
title: "[BUG] "
body:
  - type: markdown
    attributes:
      value: "記述ルール: [Issueの書き方](https://github.com/nxc-project/nixos-json-controller/blob/main/docs/project-management/issue-writing.md)。原因を決めつけず、実際に観察した挙動と期待値を分けてください。再現条件が完全でなくても、確認済みの症状があれば起票できます。特定PBIの達成を妨げるBugは「Parent PBI number (optional)」に親PBI番号だけを入力してください。Owner / Member / Collaboratorが作成したIssueでは、GitHub ActionsがIssue作成後に親子関係を設定します。外部ユーザーのIssueはメンテナーがレビュー後に追加します。横断的なBugは空欄のまま独立Issueにできます。"
  - type: textarea
    id: why
    attributes:
      label: Why（現状と影響）
      description: なぜ修正が必要か、利用者・安全性・品質にどんな影響があるかを書きます。原因が未確定なら仮説と明記します。
      placeholder: "現状は...。そのため...という影響がある。"
    validations:
      required: false
  - type: textarea
    id: observed
    attributes:
      label: 実際に起きていること
      description: 実際の動作、発生頻度、影響を書いてください。分かっていない原因は断定しないでください。
      placeholder: "特定の操作後に...となり、利用者が...できない。"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期待すること
      description: 正しい動作・状態を記載してください。
      placeholder: "...の場合でも...できる。"
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 再現手順
      description: 再現できる場合は最小手順を書いてください。再現できない場合は「未確認」と記載します。
      placeholder: "1. ...\n2. ...\n3. ..."
    validations:
      required: false
  - type: textarea
    id: environment
    attributes:
      label: 環境・証拠
      description: NixOS、Wayland compositor、GPU/driver、WebKitGTK、起動方法、ログなど、切り分けに必要な情報を記載してください。
      placeholder: "OS: ...\n起動方法: ...\nログ: ..."
    validations:
      required: false
  - type: textarea
    id: acceptance
    attributes:
      label: 修正後の確認
      description: 再現条件、回帰テスト、失敗系や境界条件など、修正完了時に確認する観点を記載してください。原因未確定なら後から追記できます。
      placeholder: "- 再現手順で期待値を満たす。\n- 関連する回帰テストが成功する。"
    validations:
      required: false
  - type: textarea
    id: related
    attributes:
      label: 関連Issue・PR
      description: Project #166、PBL #167、関連する過去IssueやPRを記載してください。
      placeholder: "- Project: #166\n- PBL: #167\n- Related: #番号"
    validations:
      required: false
  - type: input
    id: parent_pbi
    attributes:
      label: Parent PBI number (optional)
      description: "親PBIがある場合はIssue番号だけを入力してください（例: 177）。空欄なら親子関係を設定せず、独立Issueとして作成します。"
      placeholder: "177"
    validations:
      required: false
  - type: textarea
    id: supplemental
    attributes:
      label: 補足・詳細記録
      description: 上の項目に収まらない設計判断、調査記録、比較結果、履歴、追加の検証情報などを記載します。重複は避け、必要な情報を保持してください。
      placeholder: "設計判断、調査メモ、関連資料など（必要な場合のみ）。"
    validations:
      required: false
