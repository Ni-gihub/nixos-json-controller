name: 技術調査（SPIKE）
description: 原因・実現可能性・設計判断を根拠に基づいて明らかにする
type: Spike
title: "[SPIKE] "
body:
  - type: markdown
    attributes:
      value: "記述ルール: [Issueの書き方](https://github.com/nxc-project/nixos-json-controller/blob/main/docs/project-management/issue-writing.md)。調査の開始時点で原因や結論を決める必要はありません。確認済みの事実と仮説を区別し、何を判断できれば調査完了かを記載してください。まず調査対象に関係する既存PBIを検索し、原則としてそのPBIの子Issueにしてください。適切なPBIがなければ、調査が必要なユーザー価値を表すPBIを先に作成します。特定のPBIに直接寄与しない横断的な調査だけ独立Issueにでき、その理由を本文に記載してください。Owner / Member / Collaboratorが作成したIssueでは、GitHub ActionsがIssue作成後に親子関係を設定します。外部ユーザーのIssueはメンテナーがレビュー後に追加します。"
  - type: textarea
    id: question
    attributes:
      label: 調査したい問い
      description: 調査後に判断できるようになりたいことを、問いの形で書いてください。
      placeholder: "高速スクロール時の表示の重なりは、CSS・DOM・WebKitGTK/GPUのどの経路で発生しているか。"
    validations:
      required: true
  - type: textarea
    id: facts
    attributes:
      label: 確認済みの事実と仮説
      description: 再現結果、コード、ログ、環境など確認済みの情報を書きます。仮説は未確認と分かるように記載します。
      placeholder: "確認済み: ...。仮説: ...（まだ未確認）。"
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 調査範囲・制約
      description: 比較したい条件、対象外、性能・安全性など守るべき条件を書きます。
      placeholder: "同じ操作で一度に1要因を変えて比較する。通常時の描画性能を大きく悪化させる回避策は採用しない。"
    validations:
      required: false
  - type: textarea
    id: investigation_plan
    attributes:
      label: 調査計画・確認項目
      description: 調査手順、比較する条件、コードやログを確認する観点などを記載します。
      placeholder: "- 再現条件を整理する。\n- 候補となる原因や取得経路を比較する。"
    validations:
      required: false
  - type: textarea
    id: outcome
    attributes:
      label: 調査の完了条件・成果物
      description: どのような証拠や判断材料を残せば完了かを書いてください。必ずしも修正完了を調査Issueの条件にしません。
      placeholder: "- 再現条件と環境が記録される。\n- 原因候補を比較した結果と、次の対応案の推奨理由が残る。"
    validations:
      required: false
  - type: textarea
    id: related
    attributes:
      label: 関連Issue・PR・資料
      description: Project #166、PBL #167、親PBIやブロッカー、参考資料を記載してください。
      placeholder: "- Project: #166\n- PBL: #167\n- PBI / Related: #番号"
    validations:
      required: false
  - type: input
    id: parent_pbi
    attributes:
      label: Parent PBI number (optional)
      description: "原則として関連する親PBIのIssue番号だけを入力してください（例: 177）。特定PBIに直接寄与しない横断的な調査だけ空欄にでき、その理由を本文に記載してください。"
      placeholder: "177"
    validations:
      required: false
  - type: textarea
    id: supplemental
    attributes:
      label: 補足・詳細記録
      description: 上の項目に収まらない設計判断、調査記録、比較結果、履歴、追加の検証情報などを記載します。重複は避け、必要な情報を保持してください。
      placeholder: "設計判断、調査メモ、関連資料など（必要な場合のみ）。"
    validations:
      required: false
