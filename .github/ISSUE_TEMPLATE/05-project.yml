name: Project / プロジェクト憲章
description: "Project #166 の項目定義を参照する（送信すると新しいIssueが作成されます）"
type: Project
title: "[PROJECT] "
body:
  - type: markdown
    attributes:
      value: "記述ルール: [Issueの書き方](https://github.com/nxc-project/nixos-json-controller/blob/main/docs/project-management/issue-writing.md)。このフォームの送信は既存Issue #166 を更新せず、新しいIssueを作成します。Projectの正本は #166 です。更新時は #166 を直接編集してください。このフォームは項目構成の参照用であり、#166 の更新目的で送信しないでください。新しいProjectを別途作成する判断が明示的にある場合に限り、新規Issueとして使用します。事実・決定・未確認事項を区別してください。"
  - type: textarea
    id: overview
    attributes:
      label: プロジェクト概要
      description: プロジェクトが提供するものと目的を記載します。
      placeholder: "プロダクトの目的、提供するCLI/GUI、対象利用者など。"
    validations:
      required: true
  - type: textarea
    id: background
    attributes:
      label: 背景・解決する課題
      description: 現状、課題、対象利用者、解決する理由を記載します。
      placeholder: "現在の課題と、その影響・必要性。"
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: スコープ（対象・対象外）
      description: 対象、対象外、制約や見送り履歴を記載します。
      placeholder: "対象: ...。対象外: ...。制約: ..."
    validations:
      required: false
  - type: textarea
    id: outcomes
    attributes:
      label: 期待する成果・成功基準
      description: 観察可能な成果や、達成と判断できる条件を記載します。
      placeholder: "- ...を確認できる。
- ...の条件を満たす。"
    validations:
      required: true
  - type: textarea
    id: release_gate
    attributes:
      label: リリースゲート
      description: 公開・配布前に満たす必要がある安全性、品質、ライセンスなどの条件を記載します。
      placeholder: "- 安全性: ...
- 品質: ...
- 配布条件: ..."
    validations:
      required: false
  - type: textarea
    id: governance
    attributes:
      label: 開発・レビュー・進捗管理
      description: 開発・レビュー運用、進捗・リスク管理を記載します。
      placeholder: "開発フロー、レビュー基準、進捗管理の方針。"
    validations:
      required: false
  - type: textarea
    id: supplemental
    attributes:
      label: 補足・詳細記録
      description: 上記に収まらない決定根拠、追加記録、関連文書などを保持します。
      placeholder: "決定理由、追加資料、管理上の注意など。"
    validations:
      required: false
