name: CI

permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt

      - name: Check formatting
        shell: bash
        run: cargo fmt --all -- --check

      - name: Check Tauri Rust formatting
        run: cargo fmt --manifest-path frontend/src-tauri/Cargo.toml --all -- --check

  check:
    name: Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.98.1

      - name: Check
        run: cargo check

  test:
    name: Test (portable)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.98.1

      - name: Test
        run: cargo test --all-targets

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.9.0

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check frontend formatting
        run: pnpm format:check

      - name: Test frontend
        run: pnpm test

      - name: Lint frontend
        run: pnpm lint

      - name: Build frontend (type-checks and resolves @/ aliases)
        run: pnpm build

  nix:
    name: Nix availability
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Run Nix-dependent smoke test
        run: cargo test nix_command_is_available -- --ignored

      - name: Test missing package attributes and selected outputs
        run: |
          test_name="nixos::provenance::tests::batch_output_lookup_skips_missing_attributes_and_includes_selected_outputs"
          cargo test --lib -- --list | grep -Fxq "${test_name}: test"
          cargo test --lib "${test_name}" -- --exact

      - name: Benchmark legacy and local catalog search
        if: github.event_name == 'workflow_dispatch'
        env:
          XDG_CACHE_HOME: ${{ runner.temp }}/nxc-catalog-benchmark
        run: cargo test full_catalog_benchmark_compares_legacy_and_local_search -- --ignored --nocapture

  tauri-check:
    name: Tauri Rust check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.98.1

      - name: Install Tauri Linux dependencies
        run: |
          # The runner may contain an optional Microsoft APT feed that can return
          # 403 in CI. Tauri's Linux dependencies are from Ubuntu's repositories,
          # so disable only that unrelated feed before updating package indexes.
          while IFS= read -r source; do
            sudo mv "$source" "$source.disabled"
          done < <(grep -rl 'packages\.microsoft\.com' /etc/apt/sources.list.d 2>/dev/null || true)
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev

      - name: Check Tauri crate
        run: cargo check --manifest-path frontend/src-tauri/Cargo.toml

  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.98.1

      - name: Build
        run: cargo build

  nix-package:
    name: CLI Nix package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Build CLI Flake package
        run: nix build .#default --no-link --print-out-paths

  clippy:
    name: Clippy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: clippy

      - name: Clippy
        run: cargo clippy --all-targets --all-features

  issue-type-sync-tests:
    name: Issue Type sync tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Test Issue Type inference
        run: node --test .github/scripts/sync-issue-type.test.js

  issue-hierarchy-tests:
    name: Issue hierarchy automation tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Test PBI parent number parsing and issue type guards
        run: node --test .github/scripts/link-pbi-sub-issue.test.js

  issue-template-validation:
    name: Issue template YAML
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate Issue Form YAML syntax and required fields
        shell: ruby {0}
        run: |
          require "yaml"

          expected_types = {
            ".github/ISSUE_TEMPLATE/01-pbi.yml" => "PBI",
            ".github/ISSUE_TEMPLATE/02-task.yml" => "Task",
            ".github/ISSUE_TEMPLATE/03-bug.yml" => "Bug",
            ".github/ISSUE_TEMPLATE/04-investigation.yml" => "Spike",
            ".github/ISSUE_TEMPLATE/05-project.yml" => "Project",
            ".github/ISSUE_TEMPLATE/06-pbl.yml" => "PBL"
          }

          actual_forms = Dir.glob(".github/ISSUE_TEMPLATE/*.yml").reject do |path|
            path.end_with?("config.yml")
          end.sort
          missing_forms = expected_types.keys - actual_forms
          unexpected_forms = actual_forms - expected_types.keys
          abort("Missing expected Issue Forms: #{missing_forms.join(', ')}") unless missing_forms.empty?
          abort("Unexpected Issue Forms (add an explicit Type mapping or remove them): #{unexpected_forms.join(', ')}") unless unexpected_forms.empty?

          Dir.glob(".github/ISSUE_TEMPLATE/*.yml").sort.each do |path|
            data = YAML.load_file(path)
            if path.end_with?("config.yml")
              abort("#{path}: contact_links must be an array") unless data["contact_links"].is_a?(Array)
              data["contact_links"].each_with_index do |link, index|
                %w[name url about].each do |key|
                  abort("#{path}: contact_links[#{index}] is missing #{key}") unless link[key].is_a?(String) && !link[key].strip.empty?
                  abort("#{path}: contact_links[#{index}] URL must point to the current repository") unless link["url"].start_with?("https://github.com/nxc-project/nixos-json-controller/")
                end
              end
            else
              %w[name description title body].each do |key|
                abort("#{path}: missing required field #{key}") unless data[key]
              end
              abort("#{path}: type must be #{expected_types.fetch(path).inspect}") unless data["type"] == expected_types.fetch(path)
              abort("#{path}: body must be an array") unless data["body"].is_a?(Array)
              child_forms = %w[.github/ISSUE_TEMPLATE/02-task.yml .github/ISSUE_TEMPLATE/03-bug.yml .github/ISSUE_TEMPLATE/04-investigation.yml]
              if child_forms.include?(path)
                parent_field = data["body"].find { |item| item["id"] == "parent_pbi" }
                abort("#{path}: missing optional Parent PBI number input") unless parent_field && parent_field["type"] == "input" && parent_field.dig("attributes", "label") == "Parent PBI number (optional)"
              end
              type_labels = %w[project pbl pbi task bug spike]
              if (data["labels"] || []).any? { |label| type_labels.include?(label.downcase) }
                abort("#{path}: do not assign a Type-equivalent label; use the top-level type field")
              end
            end
            puts "Valid: #{path}"
          end

