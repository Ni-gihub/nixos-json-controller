name: Link PBI Sub-issues

on:
  issues:
    types: [opened, edited]

permissions:
  contents: read
  issues: write

concurrency:
  group: pbi-sub-issue-${{ github.repository }}-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  link:
    name: Link child Issue to its PBI
    if: github.event.issue.pull_request == null
    runs-on: ubuntu-latest

    steps:
      - name: Check out the default branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Validate and link Sub-issue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const { linkIssueToPbi } = require("./.github/scripts/link-pbi-sub-issue.js");
            await linkIssueToPbi({ github, context, core });
