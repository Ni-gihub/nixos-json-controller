name: Update App Store recommendations

on:
  schedule:
    - cron: "17 8 * * 1"
  workflow_dispatch:
  push:
    branches:
      - main
      - feat/117-arch-pkgstats-recommendations
    paths:
      - ".github/workflows/update-recommendations.yml"
      - "frontend/scripts/update-recommendations.mjs"
      - "frontend/scripts/recommendation-package-map.json"

# Serialize scheduled, manual, and push-triggered updates to avoid conflicting git pushes.
concurrency:
  group: update-recommendations
  cancel-in-progress: false

jobs:
  update-recommendations:
    # This job must commit refreshed recommendation data to the repository.
    permissions:
      contents: write
    name: Refresh Arch pkgstats recommendations
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Generate recommendation data
        run: node frontend/scripts/update-recommendations.mjs

      - name: Commit updated data when it changed
        shell: bash
        run: |
          if git diff --quiet -- frontend/public/data/recommendations.json; then
            echo "Recommendation data is unchanged."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/public/data/recommendations.json
          git commit -m "chore: update Arch pkgstats recommendations"
          git push
